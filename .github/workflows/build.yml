name: Build
run-name: "Build ${{ github.run_number }}"

# Builds Mac MD Write with the Retro68 68k toolchain from its published
# Docker image, then uploads the disk image and MacBinary app.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-68k:
    runs-on: ubuntu-latest
    container: ghcr.io/autc04/retro68:latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          echo "#define BUILD_NUMBER ${{ github.run_number }}" > src/build_number.h
          mkdir -p build
          cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/Retro68-build/toolchain/m68k-apple-macos/cmake/retro68.toolchain.cmake

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make -C build 2>&1 | tee build.log

      - name: Report compiler errors as annotations
        if: failure()
        shell: bash
        run: |
          # Annotations show on the run's summary page without signing in.
          grep -E "error|Error" build.log | head -25 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          grep -E "warning:" build.log | head -10 | while IFS= read -r line; do
            echo "::warning::${line}"
          done

      - name: Symbol map and CPU check (build summary)
        if: success()
        shell: bash
        run: |
          set +e +o pipefail
          GDB=$(ls build/*.gdb 2>/dev/null | grep -v FittedFont | head -1)
          {
            echo "## Build ${{ github.run_number }}"
            echo "Commit: ${{ github.sha }}"
            echo
            echo "### Files"
            echo '```'
            ls build
            echo '```'
            echo "### Compiler target"
            echo '```'
            m68k-apple-macos-gcc -Q --help=target 2>/dev/null | grep -E "^ +-m(68000|68020|cpu|arch|tune)"
            echo '```'
            if [ -n "$GDB" ]; then
              echo "### 68020+ instructions (must be none for the Plus/SE)"
              echo '```'
              m68k-apple-macos-objdump -d "$GDB" | grep -cE "\b(extb|mulsl|mulul|divsl|divul|bfextu|bfins|cas)\b"
              echo '```'
              echo "### Symbol map ($GDB)"
              echo '```'
              m68k-apple-macos-nm -n "$GDB" | grep -iE " [tT] " | head -400
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MacMDWrite-build-${{ github.run_number }}
          path: |
            build/MacMDWrite.dsk
            build/MacMDWrite.bin
          if-no-files-found: error
